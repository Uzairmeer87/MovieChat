server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # For Single Page Applications (SPA), reroute to index.html
        try_files $uri $uri/ /index.html;
    }

    # Add a DNS resolver for runtime resolution to prevent startup errors
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    # Proxy API requests to backend container inside Docker network
    location /api/ {
        # ${BACKEND_URL} is replaced by envsubst at container startup.
        # We assign it to a variable so Nginx resolves the hostname at runtime,
        # preventing the container from crashing if the backend is temporarily down.
        set $backend "${BACKEND_URL}";

        # Note: When using a variable, proxy_pass does not auto-append the URI,
        # but because our backend expects /api/, we just pass it with $request_uri
        proxy_pass $backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
